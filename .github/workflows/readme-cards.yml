name: Render README cards

on:
  schedule:
    - cron: "17 5 * * *"        # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_readme_cards.py"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow fonttools brotli requests beautifulsoup4

      - name: Fetch fonts (subset + keep local)
        run: |
          set -e
          mkdir -p fonts assets
          base="https://cdn.jsdelivr.net/npm"
          curl -fsSL "$base/@fontsource/space-grotesk@5/files/space-grotesk-latin-700-normal.woff2" -o fonts/sg700.woff2
          curl -fsSL "$base/@fontsource/space-grotesk@5/files/space-grotesk-latin-500-normal.woff2" -o fonts/sg500.woff2
          curl -fsSL "$base/@fontsource/jetbrains-mono@5/files/jetbrains-mono-latin-400-normal.woff2" -o fonts/jbm400.woff2
          curl -fsSL "$base/@fontsource/instrument-serif@5/files/instrument-serif-latin-400-normal.woff2" -o fonts/is400.woff2
          curl -fsSL "$base/@fontsource/instrument-serif@5/files/instrument-serif-latin-400-italic.woff2" -o fonts/is400i.woff2

          for f in sg700 sg500 jbm400 is400 is400i; do
            pyftsubset "fonts/$f.woff2" \
              --output-file="fonts/sub-$f.woff2" \
              --unicodes="U+0020-007E,U+00B7,U+2192,U+2014,U+2022" \
              --flavor=woff2 --layout-features="kern,liga" --no-hinting
          done
          rm -f fonts/sg700.woff2 fonts/sg500.woff2 fonts/jbm400.woff2 fonts/is400.woff2 fonts/is400i.woff2

      - name: Fetch avatar
        run: curl -fsSL "https://github.com/${{ github.repository_owner }}.png?size=240" -o assets/avatar.png

      - name: Sample the ASCII portrait
        run: python scripts/make_ascii_svg.py

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data fonts assets
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
